<head>
	<title>Topolang - Topology Generator</title>
	<style>
		body {
			margin: 0;
			padding: 20px;
			font-family: monospace;
			background: #f5f5f0;
			color: #222;
		}

		h1 {
			font-size: 1.1rem;
			font-weight: bold;
			margin-bottom: 16px;
			letter-spacing: 0.05em;
		}

		.controls {
			display: flex;
			gap: 8px;
			margin-bottom: 16px;
		}

		.a {
			background: #e8e4dc;
		}

		.b {
			background: #2a2a2a;
			display: grid;
		}

		.box {
			min-height: 8px;
		}

		.circle {
			aspect-ratio: 1 / 1;
			border-radius: 100%;
		}

		span {
			display: flex;
			flex-wrap: wrap;

			width: 8px;
			min-width: max-content;
			align-items: center;
			justify-content: center;
			justify-items: center;

			margin: 2.5px;
			padding: 2.5px;

			box-sizing: border-box;
			vertical-align: middle;

			transition: 0.25s;
		}

		span.enter, span.leave {
			transform: scale(0);
			opacity: 0;
			margin: 0;
			padding: 0;
			/* collapse the box itself so siblings slide rather than jump;
			   !important overrides the pinned inline size */
			width: 0 !important;
			height: 0 !important;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
		}

		span.a:hover:not(:has(*:hover)) {
			background-color: #d44639;
		}

		span.b:hover:not(:has(*:hover)) {
			background-color: #8f2814;
		}

		input {
			flex: 1;
			padding: 8px 10px;
			font-family: monospace;
			font-size: 0.9rem;
			border: 1px solid #ccc;
			background: #fff;
			outline: none;
		}

		input {
			border-color: #888;
		}

		.textf {
			padding: 8px 18px;
			font-family: monospace;
			font-size: 0.9rem;
			background: #222;
			color: #fff;
			border: none;
			cursor: pointer;
		}
		.outf {
			margin-bottom: 16px;
		}

		#dbj {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			cursor: pointer;
		}

		#dbj.expanded {
			white-space: normal;
			word-break: break-all;
		}

		button:hover {
			background: #444;
		}

		#container {
			margin-top: 32px;
			transform-origin: top center;
			transition: transform 0.25s, height 0.25s;
		}
	</style>
</head>
<body>
	<h1>Topolang Visualizer</h1>
	<div class="controls">
		<input type="text" id="in" placeholder="\x.x" value="\f.((\x.f(x x)) (\x.f(x x)))"></input>
		<button onclick="generate()" class="textf" id="gen">Compile Lambda Calculus</button>
	</div>
	<div id="dbj" class="textf outf" onclick="this.classList.toggle('expanded')" title="click to expand">[ DeBruijn Index Sets ]</div>
	<div class="controls">
		<input type="text" id="slc" value="[ Expanded Sets ]"></input>
		<button onclick="render(document.getElementById('slc').value)" class="textf" id="red">Display</button>
		<button onclick="reduce()" class="textf" id="red">Reduce Topolang</button>
	</div>
	<div id="container"></div>
	<script src="build/ulc2toposet.js"></script>
	<script src="build/toposet_reducer.js"></script>
	<script src="topology_generator.js"></script>
</body>
